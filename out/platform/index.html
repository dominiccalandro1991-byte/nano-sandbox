<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0c10" />
  <title>Voltage Cipher Studio</title>
  <link rel="stylesheet" href="css/platform.css?v=platform-2.4" />
</head>
<body>
  <div id="app" class="app">
    <!-- Slide-over drawer (off main screen) -->
    <div id="drawer-backdrop" class="drawer-backdrop" hidden></div>
    <aside id="drawer" class="drawer" aria-label="Menu" hidden>
      <div class="drawer-head">
        <strong>Menu</strong>
        <button type="button" id="drawer-close" class="icon-btn" aria-label="Close">✕</button>
      </div>
      <button type="button" class="drawer-link" data-go="chat">💬 Chat</button>
      <div class="drawer-label">Engines</div>
      <button type="button" class="drawer-link" data-go="research">Research · φ1–5</button>
      <button type="button" class="drawer-link" data-go="inventor">Inventor · φ6–10</button>
      <button type="button" class="drawer-link" data-go="coder">Coder · φ11–15</button>
      <button type="button" class="drawer-link" data-go="deploy">Deploy · φ16–20</button>
      <div class="drawer-label">Diagnostics</div>
      <button type="button" class="drawer-link" data-go="aegis">🛡️ NASE-AEGIS</button>
      <div class="drawer-label">System</div>
      <button type="button" class="drawer-link" data-go="settings">⚙️ Settings</button>
      <p id="drawer-hsys" class="drawer-meta">H_sys —</p>
    </aside>

    <!-- MAIN: chat-first (ChatGPT pattern) -->
    <div class="main-column">
      <header class="topbar">
        <button type="button" id="menu-btn" class="icon-btn" aria-label="Open menu">☰</button>
        <div class="topbar-title">
          <h1 id="screen-title">Voltage Cipher Studio</h1>
          <p id="screen-sub" class="sub">6 free models · multi-persona</p>
        </div>
        <span id="hsys-pill" class="hsys-pill" title="System health">—</span>
      </header>

      <!-- CHAT SCREEN (default home) -->
      <section id="screen-chat" class="screen active">
        <div class="chat-toolbar">
          <select id="persona-select" aria-label="Persona"></select>
          <select id="model-select" aria-label="Model"></select>
        </div>
        <div id="message-list" class="message-list" role="log" aria-live="polite"></div>
        <div class="composer-dock">
          <textarea id="composer" rows="1" placeholder="Message Voltage Cipher Studio…" aria-label="Message"></textarea>
          <button type="button" id="send-btn" class="send-btn">Send</button>
        </div>
      </section>

      <!-- ENGINE / AEGIS screens (hidden until menu pick) -->
      <section id="screen-work" class="screen" hidden>
        <div id="work-root" class="work-root"></div>
      </section>

      <!-- SETTINGS screen -->
      <section id="screen-settings" class="screen" hidden>
        <div class="settings-panel">
          <h2>Settings</h2>
          <label class="field">Backend API URL
            <input id="setting-remote" type="url" placeholder="https://nano-sandbox-api.onrender.com" />
          </label>
          <button type="button" id="save-remote" class="primary-btn">Save API URL</button>
          <hr />
          <div class="settings-row"><span>Vault</span><span id="setting-vault">—</span></div>
          <div class="settings-row"><span>H_sys</span><span id="setting-hsys">—</span></div>
          <div class="settings-row"><span>Threat</span><span id="setting-threat">—</span></div>
          <hr />
          <button type="button" id="btn-export-thread" class="ghost-btn">Export chat thread</button>
          <button type="button" id="btn-delete-thread" class="ghost-btn danger">Delete chat thread</button>
          <button type="button" id="btn-force-probe" class="ghost-btn">Force AEGIS probe</button>
          <p class="hint">Engines, AEGIS, and system tools live in the ☰ menu — not on the home chat screen.</p>
        </div>
      </section>
    </div>
  </div>

  <script src="js/nase-daemon.js?v=platform-2.4"></script>
  <script src="js/engine-isolates.js?v=platform-2.4"></script>
  <script src="js/codegen-utils.js?v=platform-2.4"></script>
  <script src="js/chat-partition.js?v=platform-2.4"></script>
  <script src="js/engine-chat.js?v=platform-2.4"></script>
  <script src="js/workspace-router.js?v=platform-2.4"></script>
  <script src="js/app.js?v=platform-2.4"></script>
</body>
</html>
